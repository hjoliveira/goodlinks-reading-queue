name: ci

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Mondays, 06:00 UTC. Scheduled runs only ever fire from the default
    # branch, so this starts working once the workflow is merged there.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Installed directly rather than via astral-sh/setup-uv: one less
      # third-party action to keep pinned, and the suite is small enough that
      # the action's dependency caching would not buy much.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # The installer has targeted both of these across versions; adding
          # both means a change of default does not silently break the run.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Fails loudly here, rather than as a confusing "uv: not found" later.
      - name: Verify uv is on PATH
        run: uv --version

      - name: Lint
        run: uv run --locked ruff check

      # Runs even when the lint step failed, so one run reports both.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run --locked ruff format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify uv is on PATH
        run: uv --version

      # uv provisions Python and the environment from pyproject.toml, including
      # the dev group that carries pytest. --locked fails if uv.lock has drifted
      # from pyproject.toml rather than silently resolving something else. The
      # suite is hermetic — it mocks every HTTP call — so no GoodLinks instance,
      # token, or .env is needed.
      - name: Run tests
        run: uv run --locked pytest
